  <rect x="440" y="130" width="100" height="24" rx="6" fill="#FF6600" opacity="0.2"/>
  <text x="460" y="148" font-family="Inter" font-size="12" font-weight="600" fill="#424242">PostNL</text>
  <text x="440" y="190" font-family="Inter" font-size="24" font-weight="700" fill="#424242">€5.45</text>
  <rect x="440" y="210" width="140" height="8" rx="4" fill="#70CAB9" opacity="0.3"/>
