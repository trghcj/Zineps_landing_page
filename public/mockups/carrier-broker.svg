  <rect x="800" y="110" width="360" height="200" rx="16" fill="#f8fafb" stroke="#e5e7eb"/>
  <rect x="820" y="130" width="100" height="24" rx="6" fill="#E30613" opacity="0.2"/>
  <text x="840" y="148" font-family="Inter" font-size="12" font-weight="600" fill="#424242">DPD</text>
  <text x="820" y="190" font-family="Inter" font-size="24" font-weight="700" fill="#424242">€5.20</text>
  <rect x="820" y="210" width="150" height="8" rx="4" fill="#70CAB9" opacity="0.3"/>
  <rect x="820" y="230" width="110" height="8" rx="4" fill="#e5e7eb"/>

  <!-- Rate Table -->
