<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" rx="20" fill="#ffffff"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="1120" height="50" rx="10" fill="#f8fafb"/>
